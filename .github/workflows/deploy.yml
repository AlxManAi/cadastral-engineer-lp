name: Build and Deploy to Yandex Cloud

on:
  push:
    branches: [ main, master ]

env:
  REGISTRY: cr.yandex
  FOLDER_ID: b1guembifkv56f8hufi2
  REPOSITORY: crpnjebl1g98mg3g9039/celp-app-20-12-25

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Yandex Container Registry
        run: |
          echo "${{ secrets.YC_SA_KEY }}" > key.json
          yc config profile create ci-profile
          yc config set service-account-key key.json
          yc config set folder-id ${{ env.FOLDER_ID }}
          echo $(yc iam create-token) | docker login ${{ env.REGISTRY }} -u iam --password-stdin

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.REPOSITORY }}:latest
