name: Build and Push Docker Image

on:
  push:
    branches: [ main, master ]

env:
  YC_REGISTRY: cr.yandex
  YC_FOLDER_ID: b1guembifkv56f8hufi2
  IMAGE_NAME: celp-app-image

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true

      - name: Login to Yandex Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.YC_REGISTRY }}
          username: 'json_key'
          password: ${{ secrets.YC_SERVICE_ACCOUNT_KEY }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.YC_REGISTRY }}/${{ env.YC_FOLDER_ID }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache 
